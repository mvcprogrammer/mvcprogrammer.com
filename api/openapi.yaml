openapi: 3.1.0

info:
  title: mvcprogrammer.com API
  version: 1.3.0
  summary: "APIs behind mvcprogrammer.com: the Experience section and the FHIR R4 patient explorer."
  description: |
    Two small, public functions served same-origin under `/api`.

    **Experience** (`/experience`, `/skills`) is the source of truth for the work history
    shown on [mvcprogrammer.com](https://mvcprogrammer.com). The site's static HTML
    carries a server-rendered copy as a fallback; on load, the page fetches this API
    and re-renders the timeline from it.

    **FHIR** (`/fhir/*`) backs the patient explorer at
    [fhir.mvcprogrammer.com](https://fhir.mvcprogrammer.com/), which the FHIR API card on
    every edition of the site opens in a dialog. It is a facade
    over a public FHIR R4 sandbox holding synthetic data only (HAPI by default, SMART
    Health IT as the configured fallback). The function parses FHIR resources with the
    Firely SDK, maps them to the small DTOs below, and returns a `trace` describing the
    upstream calls so the page can show what happened. Nothing is persisted and nothing
    beyond request metadata and upstream timing is logged.

    **Design notes**

    - Spec first. This document was written and committed before any implementation.
    - Served same-origin at `https://mvcprogrammer.com/api/*` through CloudFront
      behaviors in front of AWS Lambda functions running C# on .NET. No CORS, and the
      site's strict Content Security Policy is unchanged. `/api/fhir/*` is its own
      behavior, function, and cache policy, ordered ahead of `/api/*`.
    - Experience is backed by a single DynamoDB table; all reads are eventually
      consistent. FHIR holds no data of its own.
    - Every data response is cacheable. CloudFront honours `Cache-Control` and `ETag`,
      so the functions run rarely. Clients that send `If-None-Match` receive `304`.
    - The FHIR function applies a per-IP request budget (`429` with `Retry-After`),
      a short per-attempt upstream timeout with retries, and a hard cap on the pages it
      walks, because every call reaches a third-party server.
    - Errors use RFC 9457 Problem Details (`application/problem+json`).
    - Reads need no authentication; the data is the public resume. Experience writes
      (create, update, delete) are specified now and stubbed to `501 Not Implemented` until
      the admin API ships; they will require an API key.
    - FHIR writes (`POST`, `PUT`, `PATCH`, `DELETE` on patients) are open to visitors of the
      explorer, because the sandbox holds synthetic data only, under a demo guard enforced in
      the function (specified in 1.2.0, implemented in 1.3.0):
      - The seeded demo patient is read-only.
      - A visitor can only change or delete a patient the explorer created in the same
        session. The explorer mints a session token, sends it as `X-Demo-Session`, and every
        patient it creates carries that token as an identifier in the system
        `https://mvcprogrammer.com/fhir/demo-session`. A write whose token does not match
        answers `404`, so the explorer can neither touch nor confirm any other record.
      - Creates are idempotent through `Idempotency-Key`: the function turns the key into a
        FHIR conditional create (`If-None-Exist` on the identifier system
        `https://mvcprogrammer.com/fhir/idempotency`) and stores the key as a second
        identifier, so a retried create returns the patient it already made with `200`.
      - Writes have their own per-IP budget (10 per 10 minutes) on top of the read budget, and
        a session may create at most 5 patients. Both answer `429` with `Retry-After`.
      - Nothing is cleaned up by the function; created patients are the visitor's to delete
        and go with the next sandbox wipe.
  contact:
    name: Neal Thomas
    url: https://mvcprogrammer.com/#contact
  license:
    name: MIT
    identifier: MIT

# Explicitly public: no security schemes apply to any operation.
security: []

servers:
  - url: https://mvcprogrammer.com/api
    description: Production, behind CloudFront

tags:
  - name: Experience
    description: Positions held, newest first.
  - name: Admin
    description: Write side. Specified, stubbed, not yet implemented.
  - name: Skills
    description: Skills aggregated across positions.
  - name: FHIR
    description: Patient explorer over a public FHIR R4 sandbox. Synthetic data only.
  - name: Operations
    description: Liveness.

paths:
  /experience:
    get:
      tags: [Experience]
      operationId: listPositions
      summary: List positions
      description: |
        Returns every position, ordered by start date descending. Optionally filter
        to positions that list a given skill.
      parameters:
        - name: skill
          in: query
          required: false
          description: |
            Case-insensitive skill name. Only positions whose `skills` include it are
            returned. An unknown skill yields an empty list, not an error.
          schema:
            type: string
            minLength: 1
            maxLength: 60
          example: RabbitMQ
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The matching positions.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionList'
              examples:
                default:
                  $ref: '#/components/examples/PositionListExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Admin]
      operationId: createPosition
      summary: Create a position (stub)
      description: Stores a new position under the id in the body.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new position.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A position with that id already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /experience/{positionId}:
    get:
      tags: [Experience]
      operationId: getPosition
      summary: Get one position
      parameters:
        - name: positionId
          in: path
          required: true
          description: Stable slug identifying the position.
          schema:
            $ref: '#/components/schemas/PositionId'
          example: advancedmd
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The position.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
              examples:
                default:
                  $ref: '#/components/examples/PositionExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Admin]
      operationId: updatePosition
      summary: Replace a position (stub)
      description: Full replacement of the position at `positionId`.
      security:
        - ApiKey: []
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionInput'
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

    delete:
      tags: [Admin]
      operationId: deletePosition
      summary: Delete a position (stub)
      description: Removes the position at `positionId`.
      security:
        - ApiKey: []
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositionId'
      responses:
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List skills
      description: |
        Every distinct skill across all positions, with the positions that list it.
        Ordered by position count descending, then name ascending. Intended to drive
        the skill filter on the site.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The aggregated skills.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
              examples:
                default:
                  $ref: '#/components/examples/SkillListExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness check
      description: Returns `200` when the function is up. Does not touch DynamoDB. Never cached.
      responses:
        '200':
          description: Alive.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 1.0.0

  /fhir/patients:
    get:
      tags: [FHIR]
      operationId: searchPatients
      summary: Search patients
      description: |
        Runs `GET Patient?family=&birthdate=&identifier=` against the sandbox and maps the
        first page (`_count=20`) to list items. `family` is required so the search can never
        enumerate the whole server. `total` is present only when the sandbox reports it.
      parameters:
        - name: family
          in: query
          required: true
          description: Family name, matched by the sandbox with FHIR string-search semantics (prefix, case-insensitive).
          schema:
            type: string
            minLength: 1
            maxLength: 60
          example: Dickens
        - name: birthdate
          in: query
          required: false
          description: Exact date of birth in ISO 8601 `YYYY-MM-DD` form.
          schema:
            $ref: '#/components/schemas/IsoDate'
          example: '1979-04-12'
        - name: identifier
          in: query
          required: false
          description: An identifier value, or `system|value`, matched exactly by the sandbox. Typically an MRN.
          schema:
            type: string
            minLength: 1
            maxLength: 120
          example: 'urn:oid:1.2.36.146.595.217.0.1|12345'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The matching patients, with the upstream trace.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/FhirCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSearchResult'
              examples:
                default:
                  $ref: '#/components/examples/PatientSearchResultExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/FhirBadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

    post:
      tags: [FHIR]
      operationId: createPatient
      summary: Create a demo patient
      description: |
        Creates a `Patient` on the sandbox from the body, tagged with the visitor's session
        token and the idempotency key as identifiers, and returns the demographics the summary
        would show plus the upstream trace. The create is conditional on the idempotency key,
        so repeating the request returns the patient already made with `200` instead of `201`.
      parameters:
        - $ref: '#/components/parameters/DemoSession'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
            examples:
              default:
                $ref: '#/components/examples/PatientInputExample'
      responses:
        '201':
          description: Created. The body is the new patient as the summary would show it.
          headers:
            Location:
              $ref: '#/components/headers/PatientLocation'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientWriteResult'
              examples:
                default:
                  $ref: '#/components/examples/PatientWriteResultExample'
        '200':
          description: The same `Idempotency-Key` was used before and the patient it created still exists; that patient is returned and nothing is created.
          headers:
            Location:
              $ref: '#/components/headers/PatientLocation'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientWriteResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/WriteRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /fhir/patients/{patientId}:
    put:
      tags: [FHIR]
      operationId: replacePatient
      summary: Replace a demo patient
      description: |
        Full replacement of the patient's demographics: every field of `PatientInput` is
        written and anything omitted is cleared. The session-token and idempotency
        identifiers are kept by the function, never by the caller. Only a patient created by
        the same session can be replaced; the seeded demo patient answers `403`, and any
        other id answers `404`. Idempotent: repeating the request leaves the same resource.
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/DemoSession'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
            examples:
              default:
                $ref: '#/components/examples/PatientInputExample'
      responses:
        '200':
          description: Replaced. The body is the patient as the summary would now show it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientWriteResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/DemoPatientReadOnly'
        '404':
          $ref: '#/components/responses/WritablePatientNotFound'
        '429':
          $ref: '#/components/responses/WriteRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

    patch:
      tags: [FHIR]
      operationId: patchPatient
      summary: Change part of a demo patient
      description: |
        Applies a JSON Patch (RFC 6902) to the patient's `PatientInput` view and writes the
        result back, so a caller can change one field without resending the rest. Paths are
        the properties of `PatientInput` (`/familyName`, `/givenName`, `/sex`, `/birthDate`,
        `/mrn`); any other path, or a `test` operation that fails, answers `409`. The same
        guard as `PUT` applies. Not idempotent in general (`add` to a missing field then
        `remove` is), so the explorer disables the button while a patch is in flight.
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/DemoSession'
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PatientPatch'
            examples:
              default:
                $ref: '#/components/examples/PatientPatchExample'
      responses:
        '200':
          description: Patched. The body is the patient as the summary would now show it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientWriteResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/DemoPatientReadOnly'
        '404':
          $ref: '#/components/responses/WritablePatientNotFound'
        '409':
          $ref: '#/components/responses/PatchConflict'
        '415':
          $ref: '#/components/responses/PatchMediaType'
        '429':
          $ref: '#/components/responses/WriteRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

    delete:
      tags: [FHIR]
      operationId: deletePatient
      summary: Delete a demo patient
      description: |
        Deletes the patient on the sandbox. The same guard as `PUT` applies. Idempotent:
        deleting a patient this session already deleted answers `204` again, as the sandbox
        reports the resource gone rather than missing.
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/DemoSession'
      responses:
        '204':
          description: Deleted, or already deleted by this session. No body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/FhirBadRequest'
        '403':
          $ref: '#/components/responses/DemoPatientReadOnly'
        '404':
          $ref: '#/components/responses/WritablePatientNotFound'
        '429':
          $ref: '#/components/responses/WriteRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /fhir/patients/{patientId}/summary:
    get:
      tags: [FHIR]
      operationId: getPatientSummary
      summary: Get a patient summary
      description: |
        Demographics, resource counts, conditions split into active and resolved, recent
        vital signs, and a trace of the upstream calls. Built from five bounded requests:
        `Patient/{id}`, `Condition?patient=`, `Observation?patient=&category=vital-signs`,
        and `_summary=count` searches for Encounter and Observation. Each search follows
        `link[rel=next]` up to five pages; `trace.truncated` says whether a cap was hit.

        Conditions are split on `clinicalStatus`: `active`, `recurrence`, and `relapse`
        are active; `inactive`, `remission`, and `resolved` are resolved. Vital signs are
        selected by LOINC code (see `VitalSign`), newest first, at most 25.
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The summary.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/FhirCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
              examples:
                default:
                  $ref: '#/components/examples/PatientSummaryExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/FhirBadRequest'
        '404':
          $ref: '#/components/responses/PatientNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /fhir/patients/{patientId}/raw:
    get:
      tags: [FHIR]
      operationId: getPatientRawBundle
      summary: Get the raw FHIR resources behind a summary
      description: |
        The same resources the summary is built from, returned untouched as one FHIR
        `Bundle` of type `collection`, pretty-printed, for the "view raw bundle" toggle.
        This is the only endpoint that passes FHIR JSON through; everything else returns
        the DTOs above. The same page caps apply.
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The collection Bundle.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/FhirCacheControl'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
              examples:
                default:
                  $ref: '#/components/examples/FhirBundleExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/FhirBadRequest'
        '404':
          $ref: '#/components/responses/PatientNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /fhir/capability:
    get:
      tags: [FHIR]
      operationId: getFhirCapability
      summary: Get the sandbox capability subset
      description: |
        Reads the sandbox `CapabilityStatement` (`GET metadata`) and reports only what the
        explorer depends on: the FHIR version, the server software, and whether each required
        resource and search parameter is supported. `ok` is true when every requirement is
        met. The statement is fetched lazily on first use and cached per function instance
        for an hour; it is never read on cold start.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The capability subset.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CapabilityCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitySubset'
              examples:
                default:
                  $ref: '#/components/examples/CapabilitySubsetExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /fhir/health:
    get:
      tags: [FHIR, Operations]
      operationId: getFhirHealth
      summary: Liveness check for the FHIR function
      description: Returns `200` when the function is up. Never calls the sandbox. Never cached.
      responses:
        '200':
          description: Alive.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 1.0.0

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Required by the write operations once they are implemented. Reads never need it.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An `ETag` from a previous response. If it still matches, the server replies `304` with no body.
      schema:
        type: string
      example: '"a1b2c3d4"'

    PatientId:
      name: patientId
      in: path
      required: true
      description: The sandbox's logical id for the Patient resource, as returned by the search. Never hard-coded; the sandbox is wiped periodically.
      schema:
        $ref: '#/components/schemas/FhirId'
      example: '1842'

    DemoSession:
      name: X-Demo-Session
      in: header
      required: true
      description: |
        The visitor's session token, minted by the explorer once per browser session (a
        UUID kept in `sessionStorage`). Every patient the explorer creates carries it as an
        identifier; later writes must present the same token. Missing or malformed answers
        `400`; a token that does not match the patient answers `404`.
      schema:
        $ref: '#/components/schemas/DemoToken'
      example: 6f1d2c3b-9a8e-4b7c-9d6e-5f4a3b2c1d0e

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A UUID the explorer mints per create attempt and reuses when it retries. The function
        makes the sandbox create conditional on it, so the same key can only ever produce one
        patient. Missing or malformed answers `400`.
      schema:
        $ref: '#/components/schemas/DemoToken'
      example: 0c9b8a7d-6e5f-4a3b-8c2d-1e0f9a8b7c6d

  headers:
    ETag:
      description: Strong validator for the response body. Changes whenever the data changes.
      schema:
        type: string
      example: '"a1b2c3d4"'
    CacheControl:
      description: Shared caches may hold the response for an hour; browsers revalidate after five minutes.
      schema:
        type: string
      example: public, max-age=300, s-maxage=3600
    FhirCacheControl:
      description: Sandbox data can change under the explorer, so shared caches hold FHIR-backed responses for ten minutes and browsers revalidate after one.
      schema:
        type: string
      example: public, max-age=60, s-maxage=600
    CapabilityCacheControl:
      description: The capability subset changes only when the sandbox is upgraded; shared caches may hold it for an hour.
      schema:
        type: string
      example: public, max-age=300, s-maxage=3600
    RetryAfter:
      description: Seconds until the per-IP budget has room again.
      schema:
        type: integer
        minimum: 1
      example: 120
    NoStore:
      description: Always `no-store`; a write's answer is never cached.
      schema:
        type: string
        const: no-store
    PatientLocation:
      description: URL of the created patient's summary.
      schema:
        type: string
        format: uri-reference
      example: /api/fhir/patients/1842/summary

  responses:
    NotModified:
      description: The resource has not changed since the `ETag` the client sent. No body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: A query parameter was malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/invalid-parameter
            title: Invalid parameter
            status: 400
            detail: "'skill' must be between 1 and 60 characters."
            instance: /api/experience?skill=
    NotFound:
      description: No position has that id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/not-found
            title: Position not found
            status: 404
            detail: No position with id 'acme'.
            instance: /api/experience/acme
    InternalError:
      description: Something failed on the server. The body never includes internals.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            instance: /api/experience
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/unauthorized
            title: Unauthorized
            status: 401
            instance: /api/experience
    FhirBadRequest:
      description: A query or path parameter was malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/invalid-parameter
            title: Invalid parameter
            status: 400
            detail: "'family' is required and must be between 1 and 60 characters."
            instance: /api/fhir/patients?birthdate=1979-04-12
    PatientNotFound:
      description: The sandbox has no patient with that id (it answered `404` or `410`). Ids vanish when the sandbox is wiped.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/not-found
            title: Patient not found
            status: 404
            detail: The sandbox has no Patient with id '1842'. It may have been wiped; search again.
            instance: /api/fhir/patients/1842/summary
    RateLimited:
      description: |
        The caller's IP has used its budget (60 requests per 10 minutes per function
        instance). Nothing is stored; the budget lives in the warm instance's memory.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/rate-limited
            title: Too many requests
            status: 429
            detail: This address has made 60 requests in the last 10 minutes. Try again in 120 seconds.
            instance: /api/fhir/patients?family=Dickens
    UpstreamUnavailable:
      description: |
        The sandbox answered with a server error or something that is not a FHIR Bundle,
        and retries were exhausted. The public sandbox is occasionally slow or down; the
        page shows an empty state and suggests trying again.
      headers:
        Cache-Control:
          description: Always `no-store`; failures are never cached.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/upstream-unavailable
            title: FHIR sandbox unavailable
            status: 502
            detail: hapi.fhir.org answered 503 three times in a row.
            instance: /api/fhir/patients/1842/summary
    UpstreamTimeout:
      description: The upstream budget (22 seconds across attempts and pages) ran out before the sandbox finished answering.
      headers:
        Cache-Control:
          description: Always `no-store`; failures are never cached.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/upstream-timeout
            title: FHIR sandbox timed out
            status: 504
            detail: hapi.fhir.org did not finish answering within 22 seconds.
            instance: /api/fhir/patients/1842/summary
    NotImplemented:
      description: The operation is specified but not built yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/not-implemented
            title: Not implemented
            status: 501
            detail: Write operations are part of the admin API, which has not shipped yet.
            instance: /api/experience
    ValidationFailed:
      description: A header is missing or malformed, or the body fails validation. `errors` names each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: https://mvcprogrammer.com/api/problems/validation-failed
            title: Validation failed
            status: 400
            detail: One or more fields are invalid.
            instance: /api/fhir/patients
            errors:
              familyName: ["'familyName' is required and must be between 1 and 60 characters."]
              birthDate: ["'birthDate' must be a date in YYYY-MM-DD form, not in the future."]
    DemoPatientReadOnly:
      description: The seeded demo patient cannot be changed or deleted; it is the one every visitor searches for first.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/read-only
            title: Demo patient is read-only
            status: 403
            detail: Patient 'mvc-programmer' is the seeded demo patient and cannot be changed. Create a patient of your own and change that.
            instance: /api/fhir/patients/mvc-programmer
    WritablePatientNotFound:
      description: |
        No patient with that id was created by this session. The sandbox may have no such
        patient, it may have been wiped, or it may belong to someone else; the answer is the
        same in every case so the explorer cannot probe records it did not create.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/not-found
            title: Patient not found
            status: 404
            detail: This session created no Patient with id '1842'. It may have been wiped; create another.
            instance: /api/fhir/patients/1842
    PatchConflict:
      description: |
        A patch operation could not be applied: a `test` failed, a path is not a `PatientInput`
        property, or the sandbox reported a version conflict. Nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/conflict
            title: Patch not applied
            status: 409
            detail: "Operation 2 ('test' on /givenName) failed; the patient was not changed."
            instance: /api/fhir/patients/1842
    PatchMediaType:
      description: A `PATCH` body must be `application/json-patch+json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/unsupported-media-type
            title: Unsupported media type
            status: 415
            detail: Send the patch as application/json-patch+json.
            instance: /api/fhir/patients/1842
    WriteRateLimited:
      description: |
        The caller's IP has used its write budget (10 writes per 10 minutes per function
        instance), or this session has created its 5 patients. Nothing is stored beyond the
        warm instance's memory; the session cap is counted on the sandbox.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://mvcprogrammer.com/api/problems/rate-limited
            title: Too many requests
            status: 429
            detail: This address has made 10 writes in the last 10 minutes. Try again in 240 seconds.
            instance: /api/fhir/patients

  schemas:
    PositionId:
      type: string
      description: Lowercase slug, stable across edits to the position.
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 60
      examples: [advancedmd, tops-software]

    YearMonth:
      type: string
      description: Calendar month in ISO 8601 `YYYY-MM` form.
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      examples: ['2023-12']

    WorkMode:
      type: string
      description: Where the work happened.
      enum: [remote, hybrid, on-site]

    Position:
      type: object
      description: One role at one organization.
      required: [id, title, organization, startDate, endDate, workMode, location, highlights, skills]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/PositionId'
        title:
          type: string
          description: Job title as held.
          minLength: 1
          maxLength: 120
          examples: [Senior Software Engineer]
        organization:
          type: string
          minLength: 1
          maxLength: 120
          examples: [AdvancedMD]
        startDate:
          $ref: '#/components/schemas/YearMonth'
        endDate:
          description: Last month in the role, or `null` while current.
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
        workMode:
          $ref: '#/components/schemas/WorkMode'
        location:
          type: string
          description: Free-text place, as shown on the site.
          maxLength: 80
          examples: [Florida]
        highlights:
          type: array
          description: Resume bullets, in display order.
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 400
        skills:
          type: array
          description: Skills exercised in this role. Display names, de-duplicated, case preserved.
          uniqueItems: true
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 60

    PositionInput:
      type: object
      description: A position without its id. Used by update, where the id comes from the path.
      required: [title, organization, startDate, endDate, workMode, location, highlights, skills]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        organization:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          $ref: '#/components/schemas/YearMonth'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
        workMode:
          $ref: '#/components/schemas/WorkMode'
        location:
          type: string
          maxLength: 80
        highlights:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 400
        skills:
          type: array
          uniqueItems: true
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 60

    PositionList:
      type: object
      required: [count, items]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of items returned.
        filter:
          type: object
          description: Present only when a filter was applied.
          additionalProperties: false
          properties:
            skill:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    Skill:
      type: object
      required: [name, positionCount, positionIds]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [SQL Server]
        positionCount:
          type: integer
          minimum: 1
        positionIds:
          type: array
          description: Positions listing this skill, newest first.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PositionId'

    SkillList:
      type: object
      required: [count, items]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/Skill'

    FhirId:
      type: string
      description: A FHIR logical id (`[A-Za-z0-9\-\.]{1,64}`), as the sandbox assigns it.
      pattern: '^[A-Za-z0-9\-\.]{1,64}$'
      examples: ['1842']

    IsoDate:
      type: string
      description: Calendar date in ISO 8601 `YYYY-MM-DD` form.
      format: date
      pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
      examples: ['1979-04-12']

    Sex:
      type: string
      description: FHIR `Patient.gender` (AdministrativeGender), passed through unchanged.
      enum: [male, female, other, unknown]

    DemoToken:
      type: string
      description: A UUID in its canonical lowercase form, as the explorer mints session tokens and idempotency keys.
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: ['6f1d2c3b-9a8e-4b7c-9d6e-5f4a3b2c1d0e']

    PatientInput:
      type: object
      description: |
        What a visitor can write about a demo patient: the fields the summary card shows. The
        function maps them to `Patient.name`, `Patient.gender`, `Patient.birthDate`, and an
        `MR` identifier, adds the session-token and idempotency identifiers, and never
        accepts raw FHIR, so nothing but these fields can reach the sandbox.
      required: [familyName]
      additionalProperties: false
      properties:
        familyName:
          type: string
          minLength: 1
          maxLength: 60
        givenName:
          type: string
          maxLength: 60
          description: Omit or send empty for a patient known by family name only.
        sex:
          $ref: '#/components/schemas/Sex'
        birthDate:
          $ref: '#/components/schemas/IsoDate'
          description: Must not be in the future.
        mrn:
          type: string
          maxLength: 40
          pattern: '^[A-Za-z0-9\-\.]+$'
          description: Written as an identifier of type `MR` in the system `https://mvcprogrammer.com/fhir/mrn`.

    PatientPatch:
      type: array
      description: |
        A JSON Patch (RFC 6902) against the patient's `PatientInput` view. Paths are the
        properties of `PatientInput`; `op` is one of the six RFC 6902 operations. At most 20
        operations.
      minItems: 1
      maxItems: 20
      items:
        type: object
        required: [op, path]
        additionalProperties: false
        properties:
          op:
            type: string
            enum: [add, remove, replace, move, copy, test]
          path:
            type: string
            enum: ['/familyName', '/givenName', '/sex', '/birthDate', '/mrn']
          from:
            type: string
            enum: ['/familyName', '/givenName', '/sex', '/birthDate', '/mrn']
            description: Required by `move` and `copy`.
          value:
            description: Required by `add`, `replace`, and `test`. A string of the field's form.
            type: string

    PatientWriteResult:
      type: object
      description: |
        What a write returns: the patient as the summary would now show it, and the trace of
        the upstream calls the write made.
      required: [patient, trace]
      additionalProperties: false
      properties:
        patient:
          $ref: '#/components/schemas/PatientDemographics'
        trace:
          $ref: '#/components/schemas/Trace'

    ValidationProblem:
      description: RFC 9457 Problem Details with one entry per invalid field, the shape ASP.NET's `ValidationProblemDetails` produces.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Field name to the messages for that field.
              additionalProperties:
                type: array
                items:
                  type: string

    SearchQuery:
      type: object
      description: The search as the function ran it, echoed back.
      required: [family]
      additionalProperties: false
      properties:
        family:
          type: string
        birthdate:
          $ref: '#/components/schemas/IsoDate'
        identifier:
          type: string

    PatientListItem:
      type: object
      description: "One row of the search results. Mapped from `Patient` (US Core Patient: name, gender, birthDate, identifier)."
      required: [id, name, familyName]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FhirId'
        name:
          type: string
          description: Display name, `Family, Given` from the first `official` name, else the first name.
          examples: ['Dickens, Charles']
        familyName:
          type: string
        givenName:
          type: string
          description: Given names joined by a space, when present.
        birthDate:
          $ref: '#/components/schemas/IsoDate'
        birthYear:
          type: integer
          description: Year of `birthDate`, for the row label.
          minimum: 1800
          maximum: 2100
        sex:
          $ref: '#/components/schemas/Sex'
        mrn:
          type: string
          description: The value of the first identifier typed `MR`, else the first identifier value.

    PatientSearchResult:
      type: object
      required: [count, query, items, trace]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of items returned (one page, at most 20).
        total:
          type: integer
          minimum: 0
          description: Matches on the server, present only when the sandbox reported `Bundle.total`.
        query:
          $ref: '#/components/schemas/SearchQuery'
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PatientListItem'
        trace:
          $ref: '#/components/schemas/Trace'

    Identifier:
      type: object
      description: One `Patient.identifier`, kept so the page can show the MRN with its system.
      required: [value]
      additionalProperties: false
      properties:
        system:
          type: string
          format: uri
        value:
          type: string
        type:
          type: string
          description: The identifier type code (`MR`, `SS`, `DL`, ...), when present.

    PatientDemographics:
      type: object
      description: The summary card header. Mapped from `Patient`.
      required: [id, name, familyName, initials, identifiers]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FhirId'
        name:
          type: string
        familyName:
          type: string
        givenName:
          type: string
        initials:
          type: string
          description: One or two uppercase letters for the avatar.
          minLength: 1
          maxLength: 2
        sex:
          $ref: '#/components/schemas/Sex'
        birthDate:
          $ref: '#/components/schemas/IsoDate'
        age:
          type: integer
          description: Whole years at the time of the request, when `birthDate` is known.
          minimum: 0
          maximum: 150
        mrn:
          type: string
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'

    ResourceCounts:
      type: object
      description: Exact counts from `_summary=count` searches, independent of the page caps.
      required: [conditions, encounters, observations]
      additionalProperties: false
      properties:
        conditions:
          type: integer
          minimum: 0
        encounters:
          type: integer
          minimum: 0
        observations:
          type: integer
          minimum: 0

    ConditionItem:
      type: object
      description: One `Condition` (US Core Condition). The code is the first `code.coding` whose system is SNOMED CT or ICD-10, else the first coding.
      required: [display, clinicalStatus]
      additionalProperties: false
      properties:
        display:
          type: string
          description: '`code.coding.display`, else `code.text`, else the code itself.'
          examples: [Essential hypertension]
        code:
          type: string
          examples: ['59621000']
        system:
          type: string
          format: uri
          description: The coding system URI.
          examples: ['http://snomed.info/sct']
        systemLabel:
          type: string
          description: Short label for the pill.
          enum: [SNOMED CT, ICD-10-CM, ICD-10, other]
        clinicalStatus:
          type: string
          description: The `clinicalStatus` code as the sandbox sent it.
          enum: [active, recurrence, relapse, inactive, remission, resolved, unknown]
        onsetDate:
          $ref: '#/components/schemas/IsoDate'
        recordedDate:
          $ref: '#/components/schemas/IsoDate'

    Conditions:
      type: object
      required: [active, resolved]
      additionalProperties: false
      properties:
        active:
          type: array
          description: Clinical status active, recurrence, or relapse. Newest onset first.
          items:
            $ref: '#/components/schemas/ConditionItem'
        resolved:
          type: array
          description: Clinical status inactive, remission, or resolved; the page collapses these into a count.
          items:
            $ref: '#/components/schemas/ConditionItem'

    VitalComponent:
      type: object
      description: One `Observation.component`, used by blood pressure (systolic 8480-6, diastolic 8462-4).
      required: [name, loincCode, value, unit]
      additionalProperties: false
      properties:
        name:
          type: string
        loincCode:
          type: string
        value:
          type: number
        unit:
          type: string

    VitalSign:
      type: object
      description: |
        One `Observation` in the `vital-signs` category (US Core Vital Signs), selected by LOINC
        code: 85354-9 blood pressure, 8867-4 heart rate, 29463-7 body weight, 8302-2 body height,
        8310-5 body temperature, 9279-1 respiratory rate, 2708-6 and 59408-5 oxygen saturation,
        39156-5 body mass index. Either `value` and `unit`, or `components`, is present.
      required: [date, name, loincCode]
      additionalProperties: false
      properties:
        date:
          type: string
          description: '`effectiveDateTime` or the start of `effectivePeriod`, as an ISO 8601 date or date-time.'
          examples: ['2025-11-03T09:14:00Z']
        name:
          type: string
          examples: [Blood pressure]
        loincCode:
          type: string
          examples: ['85354-9']
        value:
          type: number
        unit:
          type: string
          description: The UCUM unit as sent (`kg`, `mm[Hg]`, `/min`, `Cel`).
        components:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VitalComponent'

    UpstreamRequest:
      type: object
      description: One request the function made to the sandbox, with its paging walk folded in.
      required: [method, url, status, durationMs, entries, pages]
      additionalProperties: false
      properties:
        method:
          type: string
          description: Reads are `GET`; the write operations add `POST`, `PUT`, `PATCH`, and `DELETE`.
          enum: [GET, POST, PUT, PATCH, DELETE]
        url:
          type: string
          format: uri
          description: The first page's URL. Later pages come from `link[rel=next]`.
        status:
          type: integer
          description: HTTP status of the last page fetched.
        durationMs:
          type: integer
          minimum: 0
          description: Wall time across every attempt and page of this request.
        entries:
          type: integer
          minimum: 0
          description: Bundle entries received across all pages (or `total` for a `_summary=count` search).
        pages:
          type: integer
          minimum: 1
          description: Pages walked, including the first.

    Trace:
      type: object
      description: |
        What happened upstream, for the "under the hood" panel. When CloudFront answers from
        its cache the trace is the one recorded by the original request; the page labels it
        with `generatedAt` and shows the response's `X-Cache` header beside it.
      required: [dataSource, requests, totalDurationMs, bundleEntries, pagesWalked, pageCap, truncated, generatedAt]
      additionalProperties: false
      properties:
        dataSource:
          type: object
          required: [name, baseUrl]
          additionalProperties: false
          properties:
            name:
              type: string
              examples: [HAPI FHIR R4 public test server]
            baseUrl:
              type: string
              format: uri
              examples: ['https://hapi.fhir.org/baseR4']
        requests:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpstreamRequest'
        totalDurationMs:
          type: integer
          minimum: 0
        bundleEntries:
          type: integer
          minimum: 0
          description: Entries received across every request.
        pagesWalked:
          type: integer
          minimum: 1
        pageCap:
          type: integer
          description: Maximum pages followed per search.
          const: 5
        truncated:
          type: boolean
          description: True when any search hit the page cap, so a list may be incomplete. Counts are exact regardless.
        generatedAt:
          type: string
          format: date-time

    PatientSummary:
      type: object
      required: [patient, counts, conditions, vitals, trace]
      additionalProperties: false
      properties:
        patient:
          $ref: '#/components/schemas/PatientDemographics'
        counts:
          $ref: '#/components/schemas/ResourceCounts'
        conditions:
          $ref: '#/components/schemas/Conditions'
        vitals:
          type: array
          description: Newest first, at most 25.
          maxItems: 25
          items:
            $ref: '#/components/schemas/VitalSign'
        trace:
          $ref: '#/components/schemas/Trace'

    FhirBundle:
      type: object
      description: |
        A FHIR R4 `Bundle` of type `collection`, passed through from the sandbox untouched
        except for pretty-printing. `entry[0]` is the `Patient`; the rest are the `Condition`
        and `Observation` resources the summary was built from. Full schema: the FHIR R4
        specification, not this document.
      required: [resourceType, type, entry]
      properties:
        resourceType:
          type: string
          const: Bundle
        type:
          type: string
          const: collection
        total:
          type: integer
          description: Number of entries.
        entry:
          type: array
          items:
            type: object
            required: [resource]
            additionalProperties: true
            properties:
              fullUrl:
                type: string
                format: uri
              resource:
                type: object
                description: Any FHIR R4 resource; only the two fields every resource carries are declared here.
                required: [resourceType, id]
                additionalProperties: true
                properties:
                  resourceType:
                    type: string
                  id:
                    type: string

    ParamSupport:
      type: object
      required: [name, supported]
      additionalProperties: false
      properties:
        name:
          type: string
        supported:
          type: boolean

    ResourceSupport:
      type: object
      required: [type, supported, searchParams]
      additionalProperties: false
      properties:
        type:
          type: string
          description: FHIR resource type.
          enum: [Patient, Condition, Observation, Encounter]
        supported:
          type: boolean
          description: The resource appears in `CapabilityStatement.rest.resource` with `read` and `search-type`.
        searchParams:
          type: array
          items:
            $ref: '#/components/schemas/ParamSupport'

    CapabilitySubset:
      type: object
      description: |
        The part of the sandbox `CapabilityStatement` the explorer depends on. Required:
        Patient (`family`, `birthdate`, `identifier`), Condition (`patient`), Observation
        (`patient`, `category`, `date`), Encounter (`patient`).
      required: [ok, fhirVersion, software, baseUrl, checkedAt, resources]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          description: True when every required resource and search parameter is supported.
        fhirVersion:
          type: string
          examples: [4.0.1]
        software:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            version:
              type: string
        baseUrl:
          type: string
          format: uri
        checkedAt:
          type: string
          format: date-time
          description: When the statement was read; it is cached per function instance for an hour.
        resources:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/ResourceSupport'

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: Deployed version of the function that answered. Each function is deployed on its own, so this can trail `info.version` of this document.

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

