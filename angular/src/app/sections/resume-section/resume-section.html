<!-- Resume: the download link, then the API-backed timeline, then education and continuing education. -->
<section class="section" id="resume" aria-labelledby="resume-title">
  <div class="container">
    <div class="section-head">
      <div>
        <p class="eyebrow">04 / Resume</p>
        <h2 id="resume-title">Experience</h2>
      </div>
      <a class="button button-secondary" [href]="options.resumeUrl" rel="noopener">
        <app-icon name="download" />
        Download resume (PDF)
      </a>
    </div>

    <app-experience-timeline />

    <h3 class="subsection-title">Education</h3>
    <ol class="timeline timeline-compact" role="list">
      <li class="timeline-item">
        <h4>High School Diploma</h4>
        <p class="timeline-org">Graduated at age 16</p>
      </li>
    </ol>

    <h3 class="subsection-title">Continuing Education</h3>
    <ol class="timeline timeline-compact" role="list">
      <li class="timeline-item">
        <h4>MIT OpenCourseWare</h4>
        <p class="timeline-org">Physics &middot; Massachusetts Institute of Technology</p>
      </li>
    </ol>
  </div>
</section>
