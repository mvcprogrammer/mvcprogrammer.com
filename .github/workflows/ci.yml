name: CI

# Every test suite in the repository, on every pull request to main, so a failure is caught
# before the merge. deploy.yml calls the same workflow ahead of its deploy jobs, so a red suite
# on main deploys nothing. The "CI" summary job at the bottom is the one the protect-main
# ruleset requires; the suite jobs run in parallel and report into it.
# No AWS credentials: this workflow only reads the repository.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run for the previous one. Called from deploy.yml
# there is no pull request, and the run id keeps each deploy's gate to itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  angular:
    name: Angular edition
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: angular
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  fhir:
    name: FHIR explorer
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fhir
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fhir/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  react:
    name: React edition
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: react
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  stats:
    name: Visitor dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stats
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stats/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  tools:
    name: Tools and Lambdas
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/lambda/stats-auth/package-lock.json

      # The CloudFront log parser, the stats exporter, and the run report, as stats.yml runs them.
      - name: Test the parser and exporter
        run: node --test 'tools/test/*.test.mjs'

      - name: Install the stats sign-in Lambda
        run: npm ci
        working-directory: infra/lambda/stats-auth

      - name: Test the stats sign-in Lambda
        run: npm test
        working-directory: infra/lambda/stats-auth

  blazor:
    name: Blazor edition
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project blazor/tests/Portfolio.Blazor.Tests -c Release

  api:
    name: Experience and FHIR APIs
    runs-on: ubuntu-24.04
    # The HL7 ETL's repository tests run against a real Postgres, as the coding standard asks of
    # data-access code; the image is pinned by digest like the actions are by SHA.
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
          POSTGRES_DB: hl7_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d hl7_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x

      # The root .editorconfig encodes the coding standard; this fails on any formatting or
      # naming violation in the .NET projects, the same way a failing suite does.
      - name: Check formatting and naming
        run: dotnet format mvcprogrammer.com.sln --verify-no-changes

      - name: Test the Experience API
        run: dotnet test --project api/tests/Experience.Api.Tests -c Release

      - name: Test the FHIR API
        run: dotnet test --project api/tests/Fhir.Api.Tests -c Release

      - name: Test the HL7 ETL
        run: dotnet test --project api/tests/Hl7.Etl.Tests -c Release
        env:
          HL7_ETL_TEST_CONNECTION: Host=localhost;Username=etl;Password=etl;Database=hl7_etl_test

  # One check for the ruleset to require. It runs whatever happened above and fails when any suite did.
  ci:
    name: CI
    needs: [angular, fhir, react, stats, tools, blazor, api]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every suite passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A suite did not pass:"
          echo '${{ toJSON(needs) }}'
          exit 1
