name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".idea/**"
      - "*.sln"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Sync and invalidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The resume PDF is uploaded by hand to s3://$S3_BUCKET/resume/ and is not in this repo.
      # Neither sync below touches that prefix, so --delete leaves it alone.
      - name: Sync images (long browser TTL)
        run: |
          aws s3 sync assets/ "s3://${S3_BUCKET}/assets/" --delete \
            --cache-control "public, max-age=604800, s-maxage=31536000" \
            --exclude "README.md" --exclude "*/README.md" --exclude "*.gitkeep"

      - name: Sync page, styles, scripts, and metadata (short browser TTL)
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" --delete \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --exclude "*" \
            --include "index.html" --include "privacy.html" --include "terms.html" \
            --include "styles.css" --include "main.js" \
            --include "favicon.svg" --include "site.webmanifest" \
            --include "robots.txt" --include "sitemap.xml" --include "assets/*" \
            --exclude "assets/README.md" --exclude "assets/*/README.md" --exclude "*.gitkeep"

      - name: Fix MIME type for the web manifest
        run: |
          aws s3 cp site.webmanifest "s3://${S3_BUCKET}/site.webmanifest" \
            --content-type "application/manifest+json" \
            --cache-control "public, max-age=300, s-maxage=31536000"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
