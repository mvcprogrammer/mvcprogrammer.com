name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"
      - ".idea/**"
      - "*.sln"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  STATS_DISTRIBUTION_ID: ${{ vars.STATS_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Sync and invalidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The resume PDF is uploaded by hand to s3://$S3_BUCKET/resume/ and is not in this repo.
      # Neither sync below touches that prefix, so --delete leaves it alone.
      - name: Sync images (long browser TTL)
        run: |
          aws s3 sync assets/ "s3://${S3_BUCKET}/assets/" --delete \
            --cache-control "public, max-age=604800, s-maxage=31536000" \
            --exclude "README.md" --exclude "*/README.md" --exclude "*.gitkeep"

      - name: Sync page, styles, scripts, and metadata (short browser TTL)
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" --delete \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --exclude "*" \
            --include "index.html" --include "privacy.html" --include "terms.html" --include "404.html" \
            --include "styles.css" --include "vanilla.css" --include "main.js" \
            --include "favicon.svg" --include "favicon.ico" --include "apple-touch-icon.png" --include "site.webmanifest" \
            --include "robots.txt" --include "sitemap.xml" --include "assets/*" \
            --exclude "assets/README.md" --exclude "assets/*/README.md" --exclude "*.gitkeep"

      - name: Fix MIME type for the web manifest
        run: |
          aws s3 cp site.webmanifest "s3://${S3_BUCKET}/site.webmanifest" \
            --content-type "application/manifest+json" \
            --cache-control "public, max-age=300, s-maxage=31536000"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

  deploy-blazor:
    name: Build and deploy the Blazor edition
    runs-on: ubuntu-24.04
    env:
      BLAZOR_DISTRIBUTION_ID: ${{ vars.BLAZOR_DISTRIBUTION_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project blazor/tests/Portfolio.Blazor.Tests -c Release

      - name: Publish
        run: dotnet publish blazor/src/Portfolio.Blazor -c Release -o publish

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # CloudFront compresses on the fly, so the pre-compressed .br/.gz twins stay out of the bucket.
      # Framework files carry a content hash in their name and can be cached for a long time; the
      # two loaders without one, plus everything outside _framework, get the short browser TTL.
      - name: Sync fingerprinted framework files (long browser TTL)
        run: |
          aws s3 sync publish/wwwroot/_framework/ "s3://${S3_BUCKET}/blazor/_framework/" --delete \
            --cache-control "public, max-age=604800, s-maxage=31536000, immutable" \
            --exclude "*.br" --exclude "*.gz" --exclude "blazor.webassembly.js" --exclude "dotnet.js"

      - name: Sync everything else (short browser TTL)
        run: |
          aws s3 sync publish/wwwroot/ "s3://${S3_BUCKET}/blazor/" --delete \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --exclude "*.br" --exclude "*.gz" --exclude "_framework/*" \
            --include "_framework/blazor.webassembly.js" --include "_framework/dotnet.js"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${BLAZOR_DISTRIBUTION_ID}" \
            --paths "/*"

  deploy-angular:
    name: Build and deploy the Angular edition
    runs-on: ubuntu-24.04
    env:
      ANGULAR_DISTRIBUTION_ID: ${{ vars.ANGULAR_DISTRIBUTION_ID }}
    defaults:
      run:
        working-directory: angular
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The prebuild script copies the shared stylesheet, icons, images, and seed from the repository root.
      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The bundles carry a content hash in their names and can be cached for a long time; index.html,
      # the shared files, and the seed get the short browser TTL. CloudFront compresses on the fly.
      - name: Sync fingerprinted bundles (long browser TTL)
        run: |
          aws s3 sync dist/portfolio-angular/browser/ "s3://${S3_BUCKET}/angular/" --delete \
            --cache-control "public, max-age=604800, s-maxage=31536000, immutable" \
            --exclude "*" --include "main-*.js" --include "polyfills-*.js" --include "chunk-*.js" --include "angular-*.css"

      - name: Sync everything else (short browser TTL)
        run: |
          aws s3 sync dist/portfolio-angular/browser/ "s3://${S3_BUCKET}/angular/" --delete \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --exclude "main-*.js" --exclude "polyfills-*.js" --exclude "chunk-*.js" --exclude "angular-*.css"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${ANGULAR_DISTRIBUTION_ID}" \
            --paths "/*"

  deploy-react:
    name: Build and deploy the React edition
    runs-on: ubuntu-24.04
    env:
      REACT_DISTRIBUTION_ID: ${{ vars.REACT_DISTRIBUTION_ID }}
    defaults:
      run:
        working-directory: react
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The prebuild script copies the shared stylesheet, icons, images, and seed from the repository root;
      # the build script type-checks the app, the tests, and the Vite config before Vite bundles.
      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The bundles under bundles/ carry a content hash in their names and can be cached for a long time;
      # index.html, the shared files, and the seed get the short browser TTL. CloudFront compresses on the fly.
      - name: Sync fingerprinted bundles (long browser TTL)
        run: |
          aws s3 sync dist/bundles/ "s3://${S3_BUCKET}/react/bundles/" --delete \
            --cache-control "public, max-age=604800, s-maxage=31536000, immutable"

      - name: Sync everything else (short browser TTL)
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/react/" --delete \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --exclude "bundles/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${REACT_DISTRIBUTION_ID}" \
            --paths "/*"

  deploy-stats:
    name: Build and deploy the visitor dashboard
    # Runs once the stats distribution exists (the repository variable is set); until then the job is skipped.
    if: vars.STATS_DISTRIBUTION_ID != ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stats
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stats/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The prebuild script copies the shared stylesheet, icons, and fonts from the repository root;
      # the build script type-checks the app, the tests, and the Vite config before Vite bundles.
      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The day files under data/ are written by the stats workflow, not by this job: both syncs leave
      # that prefix alone (and a local public/data never ships, because it is not in the build on CI).
      - name: Sync fingerprinted bundles (long browser TTL)
        run: |
          aws s3 sync dist/bundles/ "s3://${S3_BUCKET}/stats/bundles/" --delete \
            --cache-control "public, max-age=604800, s-maxage=31536000, immutable"

      - name: Sync everything else (short browser TTL)
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/stats/" --delete \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --exclude "bundles/*" --exclude "data/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.STATS_DISTRIBUTION_ID }}" \
            --paths "/*"
